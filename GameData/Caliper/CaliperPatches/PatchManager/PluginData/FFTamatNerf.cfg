// Patch by Caliperstorm
// Significantly reduces the amount of antimatter produced by Far Future Technologies' Nova antimatter factory part.

// It's extremely easy to produce large quantities of antimatter in base FFT, to the extent that it is essentially free.
// For example, in heavy-elements mode it only takes 75 seconds to fill the largest antimatter tank in the mod.
// This seems wrong, both in terms of realism and game balance.

// This patch reduces the output rate of antimatter by a flat 50,000x, while also reducing the consumption rate of hydrogen and fissionpellets by the same factor.
// Power requirements remain the same.
// Now it takes about 45 Earth days to fill the largest tank. Still quite fast, but not nearly as game-breaking.
// This should also prevent people from building conversion-drive ships that produce antimatter faster than their engines use it. Ships like that should not be possible with this type of pair-production technology.

@PART[fft-antimatter-factory-1]:NEEDS[FarFutureTechnologies]:FINAL
{
	@MODULE[Module*Converter]:HAS[#moduleID[lightElements]]
	{
		@INPUT_RESOURCE:HAS[#ResourceName[LqdHydrogen]]
		{
			@Ratio *= 0.00002
		}
		@OUTPUT_RESOURCE:HAS[#ResourceName[Antimatter]]
		{
			@Ratio *= 0.00002
		}
	}
	@MODULE[Module*Converter]:HAS[#moduleID[heavyElements]]
	{
		@INPUT_RESOURCE:HAS[#ResourceName[FissionPellets]]
		{
			@Ratio *= 0.00002
		}
		@OUTPUT_RESOURCE:HAS[#ResourceName[Antimatter]]
		{
			@Ratio *= 0.00002
		}
	}
}

// Also patch the accelerator facility from Kerbal Colonies Industrial Processes. 
// Only nerfed by 5,000x, so a single accelerator facility represents 10 antimatter factories of production

@KCResourceConversionRate[KCIP-FFT-AmLight]:NEEDS[KerbalColoniesIndustrialProcesses]:FINAL
{
	@inputResources
    {
        @LqdHydrogen *= 0.0002
    }
	
	outputResources
    {
        @Antimatter *= 0.0002
    }
}

@KCResourceConversionRate[KCIP-FFT-AmHeavy]:NEEDS[KerbalColoniesIndustrialProcesses]:FINAL
{
	@inputResources
    {
        @FissionPellets *= 0.0002
    }
	
	outputResources
    {
        @Antimatter *= 0.0002
    }
}