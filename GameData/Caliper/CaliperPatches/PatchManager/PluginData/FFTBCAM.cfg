// Patch by Caliperstorm

// This patch converts the FFT 'Frisbee' engine from plasma-core antimatter to beam-core, by adjusting the matter-antimatter ratio to 1:1 (by mass) and increasing ISP.
// This is done by increasing the density of the Antimatter resource to equal that of LqdHydrogen (imagine that it is liquid or solid antihydrogen)
// As such other engines that use the 1:1 antimatter:hydrogen ratio, like the sterling systems one, can now also be considered BCAM.
// Since FFT's antimatter definition is 7.085x less dense than CRP LqdHydrogen, this patch buffs the mass ratio of antimatter tanks by that same factor

// Density patch

@RESOURCE_DEFINITION[Antimatter]:FINAL
{
	@density = 0.00007085000
}

// ISP patch

@PART[fft-antimatter-beam-1]:NEEDS[FarFutureTechnologies]
{
    @MODULE[ModuleEnginesFX]
    {
        @atmosphereCurve
        {
            -key,* = nope
            key = 0 10000000
            key = 1 50000
            key = 12 0
        }
    }
}


