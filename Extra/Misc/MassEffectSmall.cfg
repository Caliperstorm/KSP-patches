// Remove placeholder parts

-PART[ProvisionalMassEffectDrive,ProvisionalFluxChargeCapacitor] {}

// Add different placeholders!

+PART[FuelCell]:NEEDS[MassEffectDrive]:FINAL
{
	@name = MassEffectDrive
	
	@TechRequired = experimentalScience
	@entryCost = 10000000
	@cost = 95700000
	@category = Utility
	@subcategory = 0
	@title = Provisional Mass Effect Drive
	@manufacturer = Pecquenard Dynamics
	@description = This device can warp the mass of a vessel by running Electric Charge through Element Zero.
	
	MODULE 
	{
        name = ModuleMEdrive
    }
	RESOURCE
	{
		name = ElementZero
		amount = 0
		maxAmount = 20000
	}
	RESOURCE
	{
		name = Flux
		amount = 0
		maxAmount = 5000
	}
	
	-MODULE[ModuleResourceConverter],* {}
	MODULE
	{
		name = ModuleResourceConverter
		ConverterName = Flux Discharger
		StartActionName = Start Flux Discharger
		StopActionName = Stop Flux Discharger
		ToggleActionName = Toggle Flux Discharger

		AutoShutdown = false
		GeneratesHeat = false
		UseSpecialistBonus = false
		
		INPUT_RESOURCE
		{
			ResourceName = Flux
			Ratio = 20
			FlowMode = STAGE_PRIORITY_FLOW
		}
		INPUT_RESOURCE
		{
			ResourceName = XenonGas
			Ratio = 2
			FlowMode = STAGE_PRIORITY_FLOW
		}
		//OUTPUT_RESOURCE
		//{
		//	ResourceName = ElectricCharge
		//	Ratio = 1.5
		//	DumpExcess = false
		//}
	}
}

+PART[FuelCell]:NEEDS[MassEffectDrive]:FINAL
{
	@name = FluxChargeCapacitor
	
	@TechRequired = experimentalScience
	@entryCost = 82000
	@cost = 150000
	@category = Utility
	@subcategory = 0
	@title = S-5TOR Provisional Flux Charge Capacitor
	@manufacturer = Pecquenard Dynamics
	@description = This advanced high capacity Capacitor is designed to accumulate and contain the remnant Flux generated by Mass Effect Drives.
	
	RESOURCE
	{
		name = Flux
		amount = 0
		maxAmount = 5000
	}	
	
	-MODULE[ModuleResourceConverter],* {}
}